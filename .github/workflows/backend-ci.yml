name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atlantyda
          POSTGRES_USER: atlantyda
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlantyda -d atlantyda"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:4200
      POSTGRES_DB: atlantyda
      POSTGRES_USER: atlantyda
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v7

      - name: Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Kontrola konfiguracji Django
        run: python manage.py check

      - name: Kontrola migracji
        run: python manage.py makemigrations --check --dry-run

      - name: Migracje
        run: python manage.py migrate --noinput

      - name: Testy
        run: python manage.py test
